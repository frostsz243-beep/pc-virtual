name: Windows PC Virtual

on:
  workflow_dispatch:

jobs:
  windows-pc:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

      - name: Configurar RDP
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $password = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force

          New-LocalUser -Name "pcuser" `
            -Password $password `
            -FullName "PC Virtual" `
            -ErrorAction SilentlyContinue

          Set-LocalUser -Name "pcuser" -Password $password

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member "pcuser" `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member "pcuser" `
            -ErrorAction SilentlyContinue

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          Set-Service `
            -Name "TermService" `
            -StartupType Automatic

          Start-Service -Name "TermService"

          Write-Host "RDP configurado."

      - name: Instalar Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}

      - name: Mostrar IP do PC
        shell: powershell
        run: |
          Start-Sleep -Seconds 5

          $ip = tailscale ip -4

          Write-Host "================================"
          Write-Host "WINDOWS PC VIRTUAL"
          Write-Host "================================"
          Write-Host "IP: $ip"
          Write-Host "Usuario: pcuser"
          Write-Host "Porta: 3389"
          Write-Host "================================"

      - name: Manter PC ligado
        shell: powershell
        run: |
          Write-Host "PC virtual iniciado."

          while ($true) {
            Write-Host "PC ativo: $(Get-Date)"
            Start-Sleep -Seconds 300
          }
